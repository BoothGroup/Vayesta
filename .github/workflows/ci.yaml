name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    - cron: '0 2 * * *'

# Cancel superseded runs on the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"
          args: format --check --diff

  gnu:
    name: python ${{ matrix.python-version }} on ubuntu-latest with ${{ matrix.description }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        description: ["GNU compilers + OpenBLAS"]
        uv-sync-args: ["--extra dmet --extra ebcc --extra dyson"]
        include:
          - python-version: "3.11"
            documentation: true
          - python-version: "3.10"
            description: "no optional dependencies"
            uv-sync-args: "--no-default-groups --group test"
    env:
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      # The nightly run tests against the latest versions of all dependencies
      UV_LOCK_ARG: ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev cmake
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install Vayesta along with dependencies
        run: |
          uv sync $UV_LOCK_ARG ${{ matrix.uv-sync-args }}
          uv run --no-sync python -c 'import numpy as np; np.__config__.show()'
      - name: Run unit tests
        run: |
          uv run --no-sync python .github/workflows/run_tests.py
      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
        if: ${{ matrix.python-version != '3.10' }}
      - name: Build docs
        run: |
          uv sync $UV_LOCK_ARG ${{ matrix.uv-sync-args }} --group docs
          source .venv/bin/activate
          cd docs
          bash make_apidoc.sh
          make html
        if: ${{ matrix.documentation }}
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          force_orphan: true
        if: ${{ matrix.documentation && github.ref == 'refs/heads/master' && github.event_name != 'schedule' }}
