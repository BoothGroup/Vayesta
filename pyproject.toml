[project]
name = "Vayesta"
description = "A toolkit for quantum embedding methods"
keywords = [
    "embedding",
    "quantum", "chemistry",
    "material", "science",
    "electronic", "structure",
    "dmet", "rpa"
]
authors = [
    {name="M. Nusspickel", email="vayesta.embedding@gmail.com"},
    {name="O. J. Backhouse", email="vayesta.embedding@gmail.com"},
    {name="B. Ibrahim", email="vayesta.embedding@gmail.com"},
    {name="A. Santana-Bonilla", email="vayesta.embedding@gmail.com"},
    {name="C. J. C. Scott", email="vayesta.embedding@gmail.com"},
    {name="A. Khedkar", email="vayesta.embedding@gmail.com"},
    {name="G. H. Booth", email="vayesta.embedding@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.10.0,",
    "h5py>=3.0.0",
    "cvxpy>=1.1",
    "pyscf>=2.8",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "vayesta.__version__"}

[project.optional-dependencies]
dmet = [
    "cvxpy>=1.1,<1.8.2",
]
mpi = [
    "mpi4py>=3.0.0",
]
dyson = [
    "dyson @ git+https://github.com/BoothGroup/dyson@master",
    # Required by dyson, but not declared as a dependency there
    "typing-extensions>=4.0",
]
ebcc = [
    "ebcc>=1.4.0",
]
pygnme = [
    "pygnme @ git+https://github.com/BoothGroup/pygnme@master",
]

[dependency-groups]
test = [
    "pytest>=7",
    "pytest-cov",
]
dev = [
    {include-group = "test"},
    "pre-commit",
    "pyright",
    "ruff",
]
docs = [
    "sphinx!=5.1.0",
    "sphinx_rtd_theme",
]

[tool.coverage.run]
branch = true
source = ["vayesta"]
omit = [
    "*/libs/*",
    "*/tests/*",
    "*/tools/*",
    "*/core/DEL/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise RuntimeError",
    "raise NotImplementedError",
    "raise AssertionError",
    "raise ValueError",
    "raise AbstractMethodError",
    "except ImportError",
    "pass",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
    "log.error",
    "log.critical",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not veryslow'"
testpaths = ["vayesta/tests"]
markers = [
    "fast",
    "slow",
    "veryslow",
]

[tool.black]
line-length = 120
target-version = [
    "py39",
    "py310",
    "py311",
    "py312",
    "py313",
]
include="\\.py"
extend-exclude = """
/(
    __pycache__*
/)
"""

[tool.pyright]
include = ["vayesta"]
exclude = ["**/__pycache__", "vayesta/tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# Optional dependencies may not be installed
reportMissingImports = "warning"
# TODO: the following rules currently have many violations and are only reported as warnings.
# Fix the violations and remove the rules here to report them as errors.
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportGeneralTypeIssues = "warning"
reportIndexIssue = "warning"
reportOperatorIssue = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportOptionalSubscript = "warning"
reportPossiblyUnbound = "warning"
reportRedeclaration = "warning"
reportUndefinedVariable = "warning"
