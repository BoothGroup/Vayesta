[project]
name = "Vayesta"
description = "A toolkit for quantum embedding methods"
keywords = [
    "embedding",
    "quantum", "chemistry",
    "material", "science",
    "electronic", "structure",
    "dmet", "rpa"
]
authors = [
    {name="M. Nusspickel", email="vayesta.embedding@gmail.com"},
    {name="O. J. Backhouse", email="vayesta.embedding@gmail.com"},
    {name="B. Ibrahim", email="vayesta.embedding@gmail.com"},
    {name="A. Santana-Bonilla", email="vayesta.embedding@gmail.com"},
    {name="C. J. C. Scott", email="vayesta.embedding@gmail.com"},
    {name="A. Khedkar", email="vayesta.embedding@gmail.com"},
    {name="G. H. Booth", email="vayesta.embedding@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.10.0,",
    "h5py>=3.0.0",
    "cvxpy>=1.1",
    "pyscf @ git+https://github.com/pyscf/pyscf@master",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "vayesta.__version__"}

[project.optional-dependencies]
dmet = [
    "cvxpy>=1.1,<1.8.2",
]
mpi = [
    "mpi4py>=3.0.0",
]
dyson = [
    "dyson @ git+https://github.com/BoothGroup/dyson@master",
]
ebcc = [
    "ebcc @ git+https://github.com/BoothGroup/ebcc@master",
]
pygnme = [
    "pygnme @ git+https://github.com/BoothGroup/pygnme@master" 
]
dev = [
    "cvxpy>=1.1",
    "mpi4py>=3.0.0",
    "dyson @ git+https://github.com/BoothGroup/dyson@master",
    "ebcc>=1.4.0",
    "ruff>=0.9",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.coverage.run]
branch = true
source = ["vayesta"]
omit = [
    "*/libs/*",
    "*/tests/*",
    "*/tools/*",
    "*/core/DEL/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise RuntimeError",
    "raise NotImplementedError",
    "raise AssertionError",
    "raise ValueError",
    "raise AbstractMethodError",
    "except ImportError",
    "pass",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
    "log.error",
    "log.critical",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not veryslow'"
testpaths = ["vayesta/tests"]
markers = [
    "fast",
    "slow",
    "veryslow",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Rule codes: https://docs.astral.sh/ruff/rules/
select = [
    "E4",  # pycodestyle: import errors
    "E7",  # pycodestyle: statement errors
    "E9",  # pycodestyle: runtime (syntax/IO) errors
    "F",   # Pyflakes: undefined names, unused imports/variables, ...
    "W",   # pycodestyle warnings: whitespace, invalid escape sequences
]
ignore = [
    "E731",  # lambda-assignment: `f = lambda x: ...` instead of `def f(x): ...`
    # TODO: fix the existing violations and remove these:
    "E402",  # module-import-not-at-top-of-file
    "E721",  # type-comparison: `type(x) == T` instead of `isinstance(x, T)`
    "E741",  # ambiguous-variable-name: variables named `l`, `I` or `O`
    "F401",  # unused-import
    "F811",  # redefined-while-unused
    "F821",  # undefined-name
    "F841",  # unused-variable
]

[tool.ruff.lint.per-file-ignores]
# F401: unused-import (re-exports), F403: `from module import *`,
# F405: name may be undefined or come from a star import
"__init__.py" = ["F401", "F403", "F405"]
"examples/**" = ["F403", "F405"]
